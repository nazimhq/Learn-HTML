    function icon(name, cls) {
      var wrap = document.createElement("span");
      wrap.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="' + (cls || "h-5 w-5") + '">' + (ICONS[name] || ICONS.check) + "</svg>";
      return wrap.firstChild;
    }

    /* Build an element: h("div", {class: "..."}, child, "text", ...) */
    function h(tag, attrs) {
      var el = document.createElement(tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];

    var contact = C.contact || {};

    /* ---------- Brand + WhatsApp buttons ---------- */
